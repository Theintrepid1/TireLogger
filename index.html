<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e14">
<title>Tire Log</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#141a24; --panel2:#1c2533; --line:#2a3547;
    --ink:#f4f7fb; --dim:#8da0b8; --accent:#ff3b2f; --accent2:#23a6ff;
    --ok:#26d07c; --over:#ff5a3c; --under:#ffb43c;
    --tap:#28344a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:17px;line-height:1.3;overscroll-behavior:none;}
  body{padding:0 0 96px;max-width:520px;margin:0 auto;min-height:100vh}
  .top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#0a0e14,#0a0e14ee);
    backdrop-filter:blur(6px);padding:14px 16px 10px;border-bottom:2px solid var(--line);
    display:flex;align-items:center;gap:10px}
  .top h1{font-size:18px;font-weight:800;letter-spacing:.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .badge{font-size:11px;font-weight:700;color:var(--bg);background:var(--accent);
    padding:3px 8px;border-radius:6px;letter-spacing:.5px;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wrap{padding:16px}
  .muted{color:var(--dim);font-size:13px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;
    border:none;border-radius:14px;font-size:17px;font-weight:700;color:var(--ink);
    background:var(--tap);padding:16px;width:100%;cursor:pointer;letter-spacing:.3px}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.accent2{background:var(--accent2);color:#04121f}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--dim);font-weight:600}
  .btn.danger{border-color:var(--accent);color:var(--accent);margin-top:6px}
  .btn.danger:active{background:var(--accent);color:#fff}
  .btn.sm{padding:11px;font-size:14px;border-radius:11px}
  .row{display:flex;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:16px;margin-bottom:14px}
  .card h2{font-size:15px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    color:var(--dim);margin-bottom:4px}
  .sess-item{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:15px;margin-bottom:11px;cursor:pointer;display:flex;align-items:center;gap:12px}
  .sess-item:active{background:var(--panel2)}
  .sess-item .typchip{font-size:10px;font-weight:800;padding:4px 8px;border-radius:7px;letter-spacing:.6px}
  .typ-track{background:var(--accent2);color:#04121f}
  .typ-autox{background:var(--under);color:#1a1206}
  .sess-item .meta{flex:1;min-width:0}
  .sess-item .meta .t{font-weight:700;font-size:16px}
  .sess-item .arrow{color:var(--dim);font-size:22px}
  /* tire grid */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:6px}
  .tire{background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:10px 8px}
  .tire .lab{font-size:12px;font-weight:800;color:var(--dim);text-align:center;letter-spacing:.8px;margin-bottom:5px}
  .stepper{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .stepper button{width:50px;height:50px;border:none;border-radius:13px;background:var(--tap);
    color:var(--ink);font-size:28px;font-weight:700;cursor:pointer;flex:none;line-height:1}
  .stepper button:active{background:var(--accent);color:#fff}
  .stepper .val{flex:1;text-align:center;font-size:32px;font-weight:800;
    font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .stepper .val small{font-size:12px;color:var(--dim);font-weight:600;display:block;margin-top:-3px}
  .climb{text-align:center;font-size:12px;font-weight:700;margin-top:5px;padding:3px;border-radius:7px}
  .climb.pos{color:var(--ok)} .climb.neg{color:var(--under)}
  .climb .pos{color:var(--ok)} .climb .neg{color:var(--under)}
  /* temps */
  .temprow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .tcell{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 3px;text-align:center}
  .tcell .tl{font-size:10px;color:var(--dim);font-weight:800;letter-spacing:.5px}
  .tinp{width:100%;background:transparent;border:none;color:var(--ink);
    font-size:22px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;
    margin-top:3px;padding:4px 0;min-width:0}
  .tinp::placeholder{color:var(--line)}
  .flag{margin-top:7px;text-align:center;font-size:11px;font-weight:800;letter-spacing:.5px;padding:5px;border-radius:8px}
  .flag.ok{background:rgba(38,208,124,.15);color:var(--ok)}
  .flag.over{background:rgba(255,90,60,.15);color:var(--over)}
  .flag.under{background:rgba(255,180,60,.15);color:var(--under)}
  .flag.none{background:transparent;color:var(--dim)}
  .toggle-temps{font-size:15px;color:var(--accent2);font-weight:700;text-align:center;
    margin-top:10px;cursor:pointer;padding:14px;border:1.5px solid var(--line);
    border-radius:13px;background:var(--panel2);letter-spacing:.2px}
  .toggle-temps:active{background:var(--tap)}
  /* per-run weather */
  .wxrow{display:flex;gap:10px;align-items:flex-end;margin-top:10px}
  .wxfield{flex:1}
  .wxbtn{width:auto;flex:none;padding:13px 16px;font-size:15px;white-space:nowrap}
  .gpsnote{font-size:12px;color:var(--ink);margin-top:5px;font-weight:600;letter-spacing:.2px;line-height:1.5}
  .gpscoord{font-size:11px;color:var(--dim);font-weight:400;font-variant-numeric:tabular-nums}
  .gridlab{font-size:12px;font-weight:800;color:var(--dim);letter-spacing:.5px;margin-top:12px;margin-bottom:2px}
  .run-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .run-head .rt{font-weight:800;font-size:16px;flex:1}
  .run-head .del{color:var(--dim);font-size:13px;padding:4px 8px;cursor:pointer}
  input.txt,select.txt{width:100%;background:var(--panel2);border:1px solid var(--line);
    border-radius:11px;color:var(--ink);font-size:16px;padding:13px;margin-top:6px;font-family:inherit}
  label.fl{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.4px;text-transform:uppercase}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:4px;gap:4px;margin-top:6px}
  .seg button{flex:1;border:none;background:transparent;color:var(--dim);font-weight:700;
    font-size:15px;padding:12px;border-radius:10px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  .seg button.on.ax{background:var(--under);color:#1a1206}
  .seg.s3 button{padding:9px;font-size:14px}
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;width:calc(100% - 32px);
    max-width:488px;z-index:40}
  .back{font-size:24px;color:var(--dim);cursor:pointer;padding:0 4px 0 0;line-height:1}
  .small-note{font-size:11px;color:var(--dim);text-align:center;margin-top:6px}
  .hide{display:none!important}
  /* analysis */
  .tgtrow{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:6px}
  .tgtbox{background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:10px 8px}
  .tgtlab{font-size:12px;font-weight:800;color:var(--dim);text-align:center;letter-spacing:.8px;margin-bottom:5px}
  .anum{text-align:center;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;margin-top:2px}
  .anum .aunit{font-size:11px;color:var(--dim);font-weight:700;margin-left:3px;letter-spacing:.3px}
  .asub{text-align:center;font-size:11px;color:var(--dim);font-weight:600;margin-top:1px}
  .trend{text-align:center;font-size:11px;color:var(--accent2);font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:.2px}
  .tspread{text-align:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
  .tline{display:flex;gap:10px;margin-top:10px}
  .tline:first-of-type{margin-top:4px}
  .tdot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none;box-shadow:0 0 0 3px rgba(255,59,47,.15)}
  .tbody{flex:1;border-left:2px solid var(--line);padding:0 0 4px 12px;margin-left:-1px}
  .thead{font-size:15px}
  .tnote{font-size:14px;margin-top:3px;line-height:1.4}
  /* backup nudge */
  .nudge{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#3a2410,#2a1a08);
    border:1px solid var(--under);border-radius:16px;padding:14px;margin-bottom:14px;cursor:pointer}
  .nudge:active{transform:scale(.99)}
  .nudgeIcon{font-size:24px;color:var(--under);flex:none}
  .nudgeBody{flex:1}
  .nudgeT{font-weight:800;font-size:15px;color:var(--ink)}
  .nudgeS{font-size:13px;color:var(--dim);margin-top:2px}
  .nudgeArr{color:var(--under);font-size:22px;font-weight:700}
  /* reference sheet */
  .sechead{font-weight:800;font-size:14px;letter-spacing:.8px;margin:6px 0 10px;display:flex;align-items:center;gap:8px}
  .sechead .typchip{font-size:11px;font-weight:800;padding:4px 9px;border-radius:7px;letter-spacing:.6px}
  .refhead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
  .refsite{font-weight:800;font-size:18px;flex:1}
  .refedit{color:var(--accent2);font-size:13px;font-weight:700;padding:4px 6px;cursor:pointer}
  .refgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .refcell{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
  .rl{font-size:10px;font-weight:800;color:var(--dim);letter-spacing:.6px}
  .rv{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:3px}
  .rsub{font-size:11px;color:var(--dim);text-align:center;margin-top:6px}
  .rnote{font-size:13px;color:var(--dim);margin-top:8px;line-height:1.4}
  .refhint{background:rgba(35,166,255,.1);border:1px solid var(--accent2);border-radius:14px;padding:12px;margin-bottom:14px}
  .refhint .rh{font-size:13px;font-weight:800;color:var(--accent2);letter-spacing:.4px}
  .refhint .rb{font-size:15px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
  .linkbtn{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--accent2);
    border-radius:16px;padding:15px;margin:16px 0 14px;cursor:pointer}
  .linkbtn:active{background:var(--panel2)}
</style>
</head>
<body>
<div class="top">
  <span id="backBtn" class="back hide">‹</span>
  <h1 id="title">Tire Log</h1>
  <span class="badge" id="badge"></span>
</div>
<div id="app" class="wrap"></div>
<div id="fab" class="fab"></div>

<script>
const TIRES=[["FL","Front L"],["FR","Front R"],["RL","Rear L"],["RR","Rear R"]];
const BUILD="2026.10.09a";  // bump this each ship so the footer confirms the loaded version
// display/entry order options. "grid" = (FL,FR,RL,RR). "clockwise" = walk-around LF,RF,RR,LR.
const TIRE_ORDERS={
  grid:["FL","FR","RL","RR"],
  clockwise:["FL","FR","RR","RL"]
};
function tireOrder(){
  const key=(DB.settings&&DB.settings.tireOrder)||"grid";
  const order=TIRE_ORDERS[key]||TIRE_ORDERS.grid;
  return order.map(code=>TIRES.find(t=>t[0]===code));
}
const KEY="brz_tire_log_v1";  // unchanged on purpose — existing data keeps loading
let DB={sessions:[],profiles:[],refs:[],settings:{}};
let view={screen:"home",sid:null};
let lastScreenKey="";

function load(){try{const r=localStorage.getItem(KEY);if(r)DB=JSON.parse(r);}catch(e){}migrate();flushSave();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){alert("Storage error — export your data to be safe.");}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function getS(id){return DB.sessions.find(s=>s.id===id);}

/* ---------- CAR / TIRE PROFILES ---------- */
function getP(id){return (DB.profiles||[]).find(p=>p.id===id);}
function activeP(){return getP(DB.settings.activeProfile)||DB.profiles[0];}
function sessP(s){return getP(s&&s.profileId)||activeP();}
function pLabel(p){return p?(p.car+" · "+p.tire):"";}

function migrate(){
  if(!DB||typeof DB!=="object")DB={};
  if(!Array.isArray(DB.sessions))DB.sessions=[];
  if(!DB.settings||typeof DB.settings!=="object")DB.settings={};
  if(!Array.isArray(DB.profiles))DB.profiles=[];
  if(!Array.isArray(DB.refs))DB.refs=[];
  if(!DB.profiles.length){
    DB.profiles.push(
      {id:"p_brz_re71rz",car:"Subaru BRZ",tire:"Bridgestone RE-71RZ",shockUnit:"turns off bottom"},
      {id:"p_brz_rt660",car:"Subaru BRZ",tire:"Falken RT660+",shockUnit:"turns off bottom"}
    );
    DB.settings.activeProfile="p_brz_re71rz";
  }
  // everything logged before profiles existed was RT660+
  const legacy=getP("p_brz_rt660")||DB.profiles[0];
  DB.sessions.forEach(s=>{if(!s.profileId)s.profileId=legacy.id;});
  if(!getP(DB.settings.activeProfile))DB.settings.activeProfile=DB.profiles[0].id;
  if(!DB.settings.seededRefs){
    if(getP("p_brz_re71rz")){
      const src="Shocks carried from RT660+ — re-verify on RZ";
      [["autocross","Bristol","1.25","1.5",src],
       ["autocross","Franklin","1.25","","Rear not logged. "+src],
       ["autocross","zMAX","0.5–1.0","1.75","Odd surface. "+src],
       ["track","NCCAR","0.75","1.5",src],
       ["track","CMP","1.25","1.5",src],
       ["track","Charlotte Roval","1.25","1.5","Baseline, no change logged. "+src]
      ].forEach(([type,site,sf,sr,note])=>{
        DB.refs.push({id:uid(),profileId:"p_brz_re71rz",type,site,
          coldF:"",coldR:"",hotF:"",hotR:"",shockF:sf,shockR:sr,note});
      });
    }
    DB.settings.seededRefs=true;
  }
}
function setActiveProfile(id){DB.settings.activeProfile=id;save();render();}
function addProfile(){
  const a=activeP()||{};
  const car=prompt("Car?",a.car||""); if(!car)return;
  const tire=prompt("Tire?",""); if(!tire)return;
  const unit=prompt("Shock adjustment unit? (blank if none)",a.shockUnit||"turns off bottom");
  const p={id:"p_"+uid(),car:car.trim(),tire:tire.trim(),shockUnit:(unit||"").trim()};
  DB.profiles.push(p);DB.settings.activeProfile=p.id;save();render();
}
function editProfile(){
  const p=activeP(); if(!p)return;
  const car=prompt("Car?",p.car); if(car==null)return;
  const tire=prompt("Tire?",p.tire); if(tire==null)return;
  const unit=prompt("Shock adjustment unit? (blank if none)",p.shockUnit||"");
  if(car.trim())p.car=car.trim(); if(tire.trim())p.tire=tire.trim();
  if(unit!=null)p.shockUnit=unit.trim();
  save();render();
}
function profileSelect(onchg,sel){
  return `<select class="txt" onchange="${onchg}">${DB.profiles.map(p=>
    `<option value="${p.id}" ${p.id===sel?"selected":""}>${esc(pLabel(p))}</option>`).join("")}</select>`;
}

/* ---------- REFERENCE SHEET ---------- */
function siteMatch(a,b){
  a=String(a||"").trim().toLowerCase(); b=String(b||"").trim().toLowerCase();
  if(!a||!b)return false;
  return a===b||a.includes(b)||b.includes(a);
}
function findRef(s){
  if(!s||!s.track)return null;
  return DB.refs.find(r=>r.profileId===s.profileId&&r.type===s.type&&siteMatch(r.site,s.track))||null;
}
// strict number: "0.5–1.0" → null (ranges stay text, never auto-applied)
function strictNum(v){if(v==null||v==="")return null;const n=Number(v);return isNaN(n)?null:n;}
function dash(v){return (v==null||v==="")?"—":esc(v);}
function updRef(id,f,v){const r=DB.refs.find(x=>x.id===id);if(r){r[f]=v;save();}}
function addRef(type){
  const r={id:uid(),profileId:activeP().id,type,site:"",coldF:"",coldR:"",hotF:"",hotR:"",shockF:"",shockR:"",note:""};
  DB.refs.push(r);view.editRef=r.id;save();render();
}
function doneRef(id){
  const r=DB.refs.find(x=>x.id===id);
  if(r&&!String(r.site||"").trim()&&!r.coldF&&!r.hotF&&!r.shockF){DB.refs=DB.refs.filter(x=>x.id!==id);}
  view.editRef=null;save();render();
}
function delRef(id){
  const r=DB.refs.find(x=>x.id===id);
  if(!confirm("Delete reference for \""+((r&&r.site)||"(untitled)")+"\"?"))return;
  DB.refs=DB.refs.filter(x=>x.id!==id);view.editRef=null;save();render();
}
function renderRef(){
  const p=activeP();
  let h=`<div class="card"><h2>Car / Tire</h2>${profileSelect("setActiveProfile(this.value)",p.id)}
    <p class="muted" style="margin-top:8px">F / R pairs.${p.shockUnit?" Shocks in "+esc(p.shockUnit)+".":""}</p></div>`;
  [["autocross","AUTOCROSS","typ-autox"],["track","TRACK","typ-track"]].forEach(([type,lab,chip])=>{
    const list=DB.refs.filter(r=>r.profileId===p.id&&r.type===type)
      .sort((a,b)=>String(a.site).localeCompare(String(b.site)));
    h+=`<div class="sechead"><span class="typchip ${chip}">${lab}</span></div>`;
    if(!list.length)h+=`<p class="small-note" style="margin:-4px 0 14px">No ${type} sites yet.</p>`;
    list.forEach(r=>{h+=(view.editRef===r.id)?refEdit(r):refCard(r);});
  });
  return h;
}
function refCard(r){
  const pair=(a,b)=>`${dash(a)} / ${dash(b)}`;
  return `<div class="card">
    <div class="refhead"><div class="refsite">${esc(r.site)||"(untitled)"}</div>
      <span class="refedit" onclick="view.editRef='${r.id}';render()">edit</span></div>
    <div class="refgrid">
      <div class="refcell"><div class="rl">COLD PSI</div><div class="rv">${pair(r.coldF,r.coldR)}</div></div>
      <div class="refcell"><div class="rl">HOT TARGET</div><div class="rv">${pair(r.hotF,r.hotR)}</div></div>
      <div class="refcell"><div class="rl">SHOCKS</div><div class="rv">${pair(r.shockF,r.shockR)}</div></div>
    </div>
    ${r.note?`<div class="rnote">${esc(r.note)}</div>`:""}
  </div>`;
}
function refEdit(r){
  const f=(lab,field,mode)=>`<div style="flex:1"><label class="fl">${lab}</label>
    <input class="txt" inputmode="${mode||"decimal"}" placeholder="—" value="${esc(r[field]||"")}"
      oninput="updRef('${r.id}','${field}',this.value)"></div>`;
  return `<div class="card">
    <label class="fl">Site</label>
    <input class="txt" placeholder="e.g. CMP" value="${esc(r.site||"")}" oninput="updRef('${r.id}','site',this.value)">
    <div class="seg" style="margin-top:10px">
      <button class="${r.type==='autocross'?'on ax':''}" onclick="updRef('${r.id}','type','autocross');render()">Autocross</button>
      <button class="${r.type==='track'?'on':''}" onclick="updRef('${r.id}','type','track');render()">Track</button>
    </div>
    <div class="row" style="margin-top:10px">${f("Cold F","coldF")}${f("Cold R","coldR")}</div>
    <div class="row" style="margin-top:10px">${f("Hot tgt F","hotF")}${f("Hot tgt R","hotR")}</div>
    <div class="row" style="margin-top:10px">${f("Shock F","shockF","text")}${f("Shock R","shockR","text")}</div>
    <div style="margin-top:10px"><label class="fl">Note</label>
      <input class="txt" value="${esc(r.note||"")}" oninput="updRef('${r.id}','note',this.value)"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn ghost danger sm" style="flex:1;margin-top:0" onclick="delRef('${r.id}')">Delete</button>
      <button class="btn primary sm" style="flex:2" onclick="doneRef('${r.id}')">Done</button>
    </div>
  </div>`;
}
function applyRef(sid){
  const s=getS(sid); const r=findRef(s); if(!r)return;
  const cf=strictNum(r.coldF), cr=strictNum(r.coldR);
  if(cf!=null){s.cold.FL=cf;s.cold.FR=cf;}
  if(cr!=null){s.cold.RL=cr;s.cold.RR=cr;}
  const sf=strictNum(r.shockF), sr=strictNum(r.shockR);
  s.runs.forEach(run=>{
    if(!run.shock)run.shock={f:null,r:null};
    if(run.shock.f==null&&sf!=null)run.shock.f=sf;
    if(run.shock.r==null&&sr!=null)run.shock.r=sr;
  });
  const ht=strictNum(r.hotF), hr=strictNum(r.hotR);
  if(ht!=null||hr!=null){const t=getTargets(s);if(ht!=null)t.front=ht;if(hr!=null)t.rear=hr;}
  save();render();
}
function saveToRef(sid){
  const s=getS(sid);
  if(!String(s.track||"").trim()){alert("Name the track/event first — that's the site name.");return;}
  const avg=(a,b)=>{const x=numOrNull(a),y=numOrNull(b);if(x==null&&y==null)return "";
    if(x==null)return String(y);if(y==null)return String(x);return String(Math.round(((x+y)/2)*10)/10);};
  const t=getTargets(s);
  let sf="",sr="";
  for(let j=s.runs.length-1;j>=0;j--){const sh=s.runs[j].shock;
    if(sh&&(sh.f!=null||sh.r!=null)){sf=sh.f!=null?String(sh.f):"";sr=sh.r!=null?String(sh.r):"";break;}}
  const vals={coldF:avg(s.cold.FL,s.cold.FR),coldR:avg(s.cold.RL,s.cold.RR),
    hotF:String(t.front),hotR:String(t.rear),shockF:sf,shockR:sr};
  const warn=(s.runs[0]&&s.runs[0].heat&&s.runs[0].heat!=="cold")
    ?"\n\n⚠ First run wasn't a cold start — the cold number may be a warm-start number.":"";
  const existing=findRef(s);
  const msg=(existing?"Overwrite reference for "+existing.site:"Save new reference for "+s.track)+"?\n\n"+
    "Cold "+(vals.coldF||"—")+" / "+(vals.coldR||"—")+
    "\nHot target "+vals.hotF+" / "+vals.hotR+
    "\nShocks "+(sf||"—")+" / "+(sr||"—")+warn;
  if(!confirm(msg))return;
  if(existing){Object.assign(existing,vals);existing.note="From "+s.date+" session";}
  else DB.refs.push(Object.assign({id:uid(),profileId:s.profileId,type:s.type,site:s.track.trim(),note:"From "+s.date+" session"},vals));
  save();alert("Saved to reference.");render();
}

function newSession(){
  const p=activeP();
  const prev=DB.sessions.find(x=>x.profileId===p.id);
  const cold=prev?{...prev.cold}:{FL:30,FR:30,RL:30,RR:30};
  const s={id:uid(),profileId:p.id,date:todayStr(),type:"track",track:"",
    cold,coldTemp:{FL:"",FR:"",RL:"",RR:""},laps:"",runs:[]};
  DB.sessions.unshift(s);save();view={screen:"session",sid:s.id};render();
}
function nowTime(){const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function seedShock(s){
  if(s.runs.length){const sh=s.runs[s.runs.length-1].shock;if(sh)return {f:sh.f,r:sh.r};}
  const r=findRef(s);
  return {f:r?strictNum(r.shockF):null,r:r?strictNum(r.shockR):null};
}
function addRun(s){
  const base=s.runs.length?{...s.runs[s.runs.length-1].p}:{...s.cold};
  s.runs.push({id:uid(),label:"Run "+(s.runs.length+1),time:nowTime(),p:{...base},
    temps:{FL:null,FR:null,RL:null,RR:null},showTemps:false,
    heat:s.runs.length?"warm":"cold",shock:seedShock(s)});
  save();render();
}

/* ---------- rendering ---------- */
function render(){
  const back=document.getElementById("backBtn");
  const app=document.getElementById("app");
  const fab=document.getElementById("fab");

    back.onclick=()=>{view={screen:"home"};render();};
    app.innerHTML=renderRef();

      <button class="btn sm" style="flex:1;padding:16px" onclick="addRef('track')">＋ Track site</button></div>`;
  }else if(view.screen==="session"){

      <button class="btn ghost" style="flex:1" onclick="view={screen:'analysis',sid:'${s.id}'};render()">📊 Analyze</button>

        <p class="muted">Something in this session's data couldn't be read. Your data is safe — this is just the analysis view. Try backing up and re-importing, or tap back to keep logging.</p>

/* ---------- ANALYSIS ---------- */
// target starts from the reference sheet if this site has one, else the last target used
// for this car/tire + type, else 30/30. Always overridable.
function defaultTargets(s){
  const r=findRef(s);
  if(r){const f=strictNum(r.hotF),rr=strictNum(r.hotR);if(f!=null||rr!=null)return {front:f!=null?f:30,rear:rr!=null?rr:30};}
  const prev=DB.sessions.find(x=>x.id!==s.id&&x.profileId===s.profileId&&x.type===s.type&&x.targets);
  if(prev)return {front:prev.targets.front,rear:prev.targets.rear};
  return {front:30,rear:30};
}
function getTargets(s){
  if(!s.targets) s.targets=defaultTargets(s);
  return s.targets;
}
function bumpTarget(sid,axle,d){
  const s=getS(sid); const t=getTargets(s);
  let nv=Math.round((t[axle]+d)*10)/10;
  if(nv<10)nv=10; if(nv>60)nv=60;
  t[axle]=nv; save(); render();
}
function resetTargets(sid){
  const s=getS(sid); s.targets=null; s.targets=defaultTargets(s); save(); render();
}

function renderAnalysis(s){
  const t=getTargets(s);
  let h="";
  h+=`<div class="card">
    <h2>📊 ${esc(s.track||"Session")} — Analysis</h2>
    <p class="muted">${esc(s.date)} · ${s.type==="track"?"Track":"Autocross"} · ${esc(pLabel(sessP(s)))} · ${s.runs.length} run${s.runs.length===1?"":"s"}.
    Targets are a <b style="color:var(--ink)">movable reference</b>, not a rule.</p>
  </div>`;

  if(!s.runs.length){
    h+=`<p class="small-note">No runs logged yet — climb and temp analysis appears once you add runs.</p>`;
    return h;
  }

  h+=`<div class="card">
    <h2>🎯 Your Target Line (PSI hot)</h2>
    <div class="tgtrow">
      <div class="tgtbox">
        <div class="tgtlab">FRONT</div>
        <div class="stepper">
          <button onclick="bumpTarget('${s.id}','front',-0.5)">−</button>
          <div class="val">${fmt(t.front)}<small>psi</small></div>
          <button onclick="bumpTarget('${s.id}','front',0.5)">＋</button>
        </div>
      </div>
      <div class="tgtbox">
        <div class="tgtlab">REAR</div>
        <div class="stepper">
          <button onclick="bumpTarget('${s.id}','rear',-0.5)">−</button>
          <div class="val">${fmt(t.rear)}<small>psi</small></div>
          <button onclick="bumpTarget('${s.id}','rear',0.5)">＋</button>
        </div>
      </div>
    </div>
    <div class="toggle-temps" onclick="resetTargets('${s.id}')">↺ reset to reference</div>
  </div>`;

  h+=`<div class="card">
    <h2>🌡 Pressure Climb by Corner</h2>
    <p class="muted" style="margin-bottom:8px">Cold → latest hot, and gap to your target line.</p>
    <div class="grid2">`;
  tireOrder().forEach(([k,lab])=>{
    const cold=numOrNull(s.cold[k]);
    const last=s.runs[s.runs.length-1];
    const hot=numOrNull(last.p[k]);
    const axle=(k==="FL"||k==="FR")?"front":"rear";
    const tgt=t[axle];
    const climb=(cold!=null&&hot!=null)?Math.round((hot-cold)*10)/10:null;
    const gap=(hot!=null)?Math.round((hot-tgt)*10)/10:null;
    const series=s.runs.map(r=>numOrNull(r.p[k])).filter(v=>v!=null);
    const lastSet=(last.set!=null)?numOrNull(last.set[k]):null;
    const vsSet=(lastSet!=null&&hot!=null)?Math.round((hot-lastSet)*10)/10:null;
    let eqHtml="";
    if(vsSet!=null){
      let eqCls="under", eqTxt=(vsSet>=0?"+":"")+vsSet+" vs set";
      if(Math.abs(vsSet)<0.6){eqCls="ok";eqTxt="≈ equilibrium ("+(vsSet>=0?"+":"")+vsSet+")";}
      else if(vsSet>0){eqCls="over";}
      eqHtml=`<div class="flag ${eqCls}" style="margin-top:5px">${eqTxt}</div>`;
    }
    let gapTxt="—", gapCls="none";
    if(gap!=null){
      if(Math.abs(gap)<0.6){gapCls="ok";gapTxt="on target";}
      else if(gap>0){gapCls="over";gapTxt="+"+gap+" vs target";}
      else {gapCls="under";gapTxt=gap+" vs target";}
    }
    h+=`<div class="tire">
      <div class="lab">${lab}</div>
      <div class="anum">${fmt(hot)}<span class="aunit">psi hot</span></div>
      <div class="asub">${lastSet!=null?"set "+fmt(lastSet)+" · ":""}cold ${fmt(cold)} · climb ${climb!=null?(climb>=0?"+":"")+climb:"—"}</div>
      <div class="flag ${gapCls}">${gapTxt}</div>
      ${eqHtml}
      ${series.length>1?`<div class="trend">${series.map(v=>fmt(v)).join(" → ")}</div>`:""}
    </div>`;
  });
  h+=`</div></div>`;

  const runsWithTemps=s.runs.filter(r=>TIRES.some(([k])=>tempFlag(r.temps[k])!=null));
  if(runsWithTemps.length){
    h+=`<div class="card">
      <h2>🔥 Tire Temp Spread</h2>
      <p class="muted" style="margin-bottom:8px">Even O/M/I = dialed, whatever the gauge says.</p>`;
    const last=runsWithTemps[runsWithTemps.length-1];
    h+=`<p class="muted" style="margin-bottom:6px">Latest with temps: <b style="color:var(--ink)">${esc(last.label)}</b></p>
      <div class="grid2">`;
    TIRES.forEach(([k,lab])=>{
      const fl=tempFlag(last.temps[k]);
      let cls="none",txt="no temps";
      if(fl==="ok"){cls="ok";txt="even · dialed";}
      else if(fl==="over"){cls="over";txt="center hot · try less psi";}
      else if(fl==="under"){cls="under";txt="edges hot · try more psi";}
      const tt=last.temps[k]||{o:"",m:"",i:""};
      h+=`<div class="tire">
        <div class="lab">${lab}</div>
        <div class="tspread">${esc(tt.o)||"—"} / ${esc(tt.m)||"—"} / ${esc(tt.i)||"—"}</div>
        <div class="asub">O / M / I °F</div>
        <div class="flag ${cls}">${txt}</div>
      </div>`;
    });
    h+=`</div></div>`;
  }

  h+=`<div class="card">
    <h2>📝 What Changed → What Happened</h2>`;
  let anyNotes=false;
  s.runs.forEach(run=>{
    const psiTxt=`F${fmt(run.p.FL)} / R${fmt(run.p.RL)}`;
    const sh=run.shock||{};
    const shTxt=(sh.f!=null||sh.r!=null)?` · shk ${fmtS(sh.f)}/${fmtS(sh.r)}`:"";
    const hTxt=run.heat?` · ${run.heat} start`:"";
    const note=(run.notes||"").trim();
    if(note) anyNotes=true;
    h+=`<div class="tline">
      <div class="tdot"></div>
      <div class="tbody">
        <div class="thead"><b>${esc(run.label)}</b> <span class="muted">${esc(run.time||"")} · ${psiTxt}${shTxt}${hTxt}</span></div>
        ${note?`<div class="tnote">${esc(note)}</div>`:`<div class="tnote muted">no notes</div>`}
      </div>
    </div>`;
  });
  if(!anyNotes){
    h+=`<p class="muted" style="margin-top:4px">Add setup notes per run to build your cause→effect history here.</p>`;
  }
  h+=`</div>`;

  h+=`<div class="card">
    <h2>📌 Save to Reference</h2>
    <p class="muted" style="margin-bottom:10px">Writes this session's cold baseline (axle avg), your target line, and the last logged shocks to the reference sheet for ${esc(s.track||"this site")} · ${esc((sessP(s)||{}).tire||"")}.</p>
    <button class="btn accent2 sm" onclick="saveToRef('${s.id}')">📌 Save as reference</button>
  </div>`;

  return h;
}

function tireStepper(sid,rk,tk,lab,val,step,cold,setv){
  let climb="";
  if(val!=null){
    let parts=[];
    if(setv!=null){
      const ds=Math.round((val-setv)*10)/10;
      parts.push(`<span class="${ds>=0?'pos':'neg'}">${ds>=0?"+":""}${ds} vs set</span>`);
    }
    if(cold!=null){
      const dc=Math.round((val-cold)*10)/10;
      parts.push(`<span class="${dc>=0?'pos':'neg'}">${dc>=0?"+":""}${dc} vs cold</span>`);
    }
    if(parts.length) climb=`<div class="climb">${parts.join(" · ")}</div>`;
  }
  return `<div class="tire"><div class="lab">${lab}</div>
    <div class="stepper">
      <button onclick="step('${sid}','${rk}','${tk}',${-step})">−</button>
      <div class="val">${fmt(val)}<small>psi</small></div>
      <button onclick="step('${sid}','${rk}','${tk}',${step})">＋</button>
    </div>${climb}</div>`;
}

function setStepper(sid,rid,tk,lab,val){
  return `<div class="tire" style="background:var(--bg)"><div class="lab">${lab} SET</div>
    <div class="stepper">
      <button onclick="stepSet('${sid}','${rid}','${tk}',-0.5)">−</button>
      <div class="val">${fmt(val)}<small>psi set</small></div>
      <button onclick="stepSet('${sid}','${rid}','${tk}',0.5)">＋</button>
    </div></div>`;
}

// shock stepper — quarter-turn steps; first tap on an empty value seeds from prior run / reference / 1.0
function shockStepper(sid,rid,axle,lab,val){
  return `<div class="tire"><div class="lab">${lab.toUpperCase()} SHOCK</div>
    <div class="stepper">
      <button onclick="stepShock('${sid}','${rid}','${axle}',-0.25)">−</button>
      <div class="val">${fmtS(val)}<small>&nbsp;</small></div>
      <button onclick="stepShock('${sid}','${rid}','${axle}',0.25)">＋</button>
    </div></div>`;
}

function tempCell(sid,rid,tk,lab,t){
  t=t||{o:"",m:"",i:""};
  const flag=tempFlag(t);
  let fcls="none",ftxt="enter temps";
  if(flag==="ok"){fcls="ok";ftxt="OK / even";}
  else if(flag==="over"){fcls="over";ftxt="OVER · drop psi";}
  else if(flag==="under"){fcls="under";ftxt="UNDER · add psi";}
  const mk=(field,v)=>`<div class="tcell"><div class="tl">${field.toUpperCase()}</div>
    <input class="tinp tinp-seq" id="tmp_${rid}_${tk}_${field}" inputmode="numeric" value="${v===""||v==null?"":esc(v)}" placeholder="—"
      oninput="setTemp('${sid}','${rid}','${tk}','${field}',this.value);advTemp(this)"></div>`;
  return `<div class="tire"><div class="lab">${lab} TEMP °F</div>
    <div class="temprow">${mk("o",t.o)}${mk("m",t.m)}${mk("i",t.i)}</div>
    <div class="flag ${fcls}">${ftxt}</div></div>`;
}
function advTemp(el){
  const v=(el.value||"").replace(/[^0-9.]/g,"");
  if(v.length>=3){
    const all=Array.from(document.querySelectorAll(".tinp-seq"));
    const i=all.indexOf(el);
    if(i>=0 && i<all.length-1){ all[i+1].focus(); all[i+1].select&&all[i+1].select(); }
  }
}

function tempFlag(t){
  if(!t||typeof t!=="object")return null;
  const o=parseFloat(t.o),m=parseFloat(t.m),i=parseFloat(t.i);
  if([o,m,i].some(isNaN))return null;
  const mid=m-(o+i)/2;
  if(mid>5)return "over";
  if(mid<-5)return "under";
  return "ok";
}

/* ---------- mutations ---------- */
function setType(id,t){const s=getS(id);s.type=t;save();render();}
function upd(id,f,v){getS(id)[f]=v;save();}
function setTireOrderPref(v){
  if(!DB.settings) DB.settings={};
  DB.settings.tireOrder=v; save(); render();
}
function setColdTemp(sid,tk,v){
  const s=getS(sid);
  if(s.coldTemp==null||typeof s.coldTemp!=="object") s.coldTemp={FL:"",FR:"",RL:"",RR:""};
  s.coldTemp[tk]=v.replace(/[^0-9.]/g,"");
  save();
}
function updRun(sid,rid,f,v){const r=getS(sid).runs.find(x=>x.id===rid);r[f]=v;save();}
function setHeat(sid,rid,v){const r=getS(sid).runs.find(x=>x.id===rid);r.heat=(r.heat===v)?"":v;save();render();}
function stepShock(sid,rid,axle,d){
  const s=getS(sid); const idx=s.runs.findIndex(x=>x.id===rid); const r=s.runs[idx];
  if(!r.shock)r.shock={f:null,r:null};
  const cur=numOrNull(r.shock[axle]);
  if(cur==null){
    // seed: previous run's value, else reference, else 1.0 — no step on the seeding tap
    let base=null;
    for(let j=idx-1;j>=0&&base==null;j--){const ps=s.runs[j].shock;if(ps)base=numOrNull(ps[axle]);}
    if(base==null){const ref=findRef(s);if(ref)base=strictNum(axle==="f"?ref.shockF:ref.shockR);}
    r.shock[axle]=base!=null?base:1;
  }else{
    let nv=Math.round((cur+d)*100)/100;
    if(nv<0)nv=0; if(nv>40)nv=40;
    r.shock[axle]=nv;
  }
  save();render();
}
function step(sid,rk,tk,d){
  const s=getS(sid);
  let obj=rk==="cold"?s.cold:s.runs.find(r=>r.id===rk).p;
  let nv=Math.round(((numOrNull(obj[tk])||0)+d)*10)/10;
  if(nv<0)nv=0; if(nv>60)nv=60;
  obj[tk]=nv;save();render();
}
function toggleTemps(sid,rid){const r=getS(sid).runs.find(x=>x.id===rid);r.showTemps=!r.showTemps;save();render();}
function toggleOpts(sid){const s=getS(sid);s._showOpts=!s._showOpts;render();}
function toggleSet(sid,rid){
  const s=getS(sid); const r=s.runs.find(x=>x.id===rid);
  r.showSet=!r.showSet;
  if(r.showSet && !r.set){
    const idx=s.runs.findIndex(x=>x.id===rid);
    const base=idx>0 ? {...s.runs[idx-1].p} : {...s.cold};
    r.set={...base};
  }
  save();render();
}
function stepSet(sid,rid,tk,d){
  const s=getS(sid); const r=s.runs.find(x=>x.id===rid);
  if(!r.set) r.set={...s.cold};
  let nv=Math.round(((numOrNull(r.set[tk])||0)+d)*10)/10;
  if(nv<0)nv=0; if(nv>60)nv=60;
  r.set[tk]=nv; save(); render();
}
function setTemp(sid,rid,tk,field,v){
  const r=getS(sid).runs.find(x=>x.id===rid);
  if(!r.temps[tk])r.temps[tk]={o:"",m:"",i:""};
  r.temps[tk][field]=v.replace(/[^0-9.]/g,"");save();
}
/* ---------- GPS WEATHER (Open-Meteo, no key) ---------- */
function wmoLabel(code){
  if(code==null||isNaN(code)) return "";
  const c=Number(code);
  if(c===0) return "Clear";
  if(c===1||c===2) return "Partly Cloudy";
  if(c===3) return "Overcast";
  if(c===45||c===48) return "Fog";
  if(c>=51&&c<=57) return "Drizzle";
  if(c>=61&&c<=67) return "Rain";
  if(c>=71&&c<=77) return "Snow";
  if(c>=80&&c<=82) return "Rain Showers";
  if(c>=85&&c<=86) return "Snow Showers";
  if(c>=95) return "Thunderstorm";
  return "";
}
function condIcon(code){
  const l=wmoLabel(code);
  if(l==="Clear") return "☀";
  if(l==="Partly Cloudy") return "⛅";
  if(l==="Overcast") return "☁";
  if(l==="Fog") return "🌫";
  if(l.indexOf("Rain")>=0||l==="Drizzle") return "🌧";
  if(l.indexOf("Snow")>=0) return "❄";
  if(l==="Thunderstorm") return "⛈";
  return "";
}
function grabWeather(sid,rid,btn){
  const orig=btn?btn.textContent:"";
  const setBtn=(txt)=>{if(btn)btn.textContent=txt;};
  if(!navigator.geolocation){
    setBtn("no GPS"); setTimeout(()=>setBtn(orig),2500); return;
  }
  setBtn("📍 locating…");
  navigator.geolocation.getCurrentPosition(
    pos=>{
      const lat=pos.coords.latitude.toFixed(4);
      const lon=pos.coords.longitude.toFixed(4);
      setBtn("☁ fetching…");
      const url="https://api.open-meteo.com/v1/forecast?latitude="+lat+
        "&longitude="+lon+"&current=temperature_2m,weather_code&temperature_unit=fahrenheit";
      fetch(url)
        .then(r=>{if(!r.ok)throw new Error("http "+r.status);return r.json();})
        .then(d=>{
          const t=d&&d.current&&typeof d.current.temperature_2m==="number"
            ? Math.round(d.current.temperature_2m) : null;
          if(t==null) throw new Error("no temp");
          const cond=wmoLabel(d.current.weather_code);
          const r=getS(sid).runs.find(x=>x.id===rid);
          r.ambient=String(t);
          r.gps={lat:lat,lon:lon,at:nowTime()};
          if(cond) r.gps.cond=cond;
          if(!r.time) r.time=nowTime();
          save();
          setBtn("✓ "+t+"°F"+(cond?" "+condIcon(d.current.weather_code):""));
          const geoUrl="https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+
            lat+"&longitude="+lon+"&localityLanguage=en";
          fetch(geoUrl)
            .then(gr=>gr.ok?gr.json():null)
            .then(g=>{
              if(g){
                const city=g.city||g.locality||"";
                const state=g.principalSubdivision||"";
                const place=[city,state].filter(Boolean).join(", ");
                if(place){
                  const rr=getS(sid).runs.find(x=>x.id===rid);
                  if(rr&&rr.gps){rr.gps.place=place;save();}
                }
              }
            })
            .catch(()=>{})
            .finally(()=>{setTimeout(()=>{render();},700);});
        })
        .catch(e=>{
          setBtn("no signal — type it");
          setTimeout(()=>setBtn(orig),3000);
        });
    },
    err=>{
      const msg = err && err.code===1 ? "allow location" : "GPS failed";
      setBtn(msg);
      setTimeout(()=>setBtn(orig),3000);
    },
    {enableHighAccuracy:false,timeout:12000,maximumAge:300000}
  );
}

function delRun(sid,rid){

function delSession(sid){

  view={screen:"home"};render();
}

/* ---------- helpers ---------- */
function timeToMin(t){
  if(!t) return null;
  const m=String(t).match(/(\d{1,2}):(\d{2})/);
  if(!m) return null;
  return parseInt(m[1],10)*60+parseInt(m[2],10);
}
function carriedTrackTemp(s,idx){
  const cur=s.runs[idx];
  const curMin=timeToMin(cur&&cur.time);
  for(let j=idx-1;j>=0;j--){
    const pr=s.runs[j];
    if(pr.trackTemp!=null&&pr.trackTemp!==""){
      const prMin=timeToMin(pr.time);
      if(curMin!=null&&prMin!=null){
        if(Math.abs(curMin-prMin)<=30) return pr.trackTemp;
        return null;
      }
      return pr.trackTemp;
    }
  }
  return null;
}
function fmt(v){
  if(v==null||v==="") return "—";
  const n=(typeof v==="number")?v:parseFloat(v);
  if(isNaN(n)) return "—";
  return Number.isInteger(n)?n:n.toFixed(1);
}
// shocks need two decimals (1.25, 0.75)
function fmtS(v){
  const n=numOrNull(v);
  if(n==null) return "—";
  return String(Math.round(n*100)/100);
}
function numOrNull(v){
  if(v==null||v==="") return null;
  const n=(typeof v==="number")?v:parseFloat(v);
  return isNaN(n)?null:n;
}
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}

/* ---------- CSV export ---------- */
// New columns (Car, Tire, ShockF, ShockR, HeatState) are appended at the END so
// existing workbook column positions don't move.
function rowsFor(s){
  const rows=[];
  const lp=s.laps||"";
  const sp=sessP(s)||{};
  const car=sp.car||"", tire=sp.tire||"";
  const ctFor=(k)=>{
    if(s.coldTemp==null) return "";
    if(typeof s.coldTemp==="object") return s.coldTemp[k]!=null?s.coldTemp[k]:"";
    return s.coldTemp;
  };
  TIRES.forEach(([k,lab])=>{
    rows.push([s.date,"",s.type,s.track,"",(s.trackTemp||""),"COLD",lab,
      s.cold[k],"","","","","","","","","","","","",ctFor(k),lp,"",
      car,tire,"","",""]);
  });
  s.runs.forEach((run,idx)=>{
    const ownTT=(run.trackTemp!=null&&run.trackTemp!=="")?run.trackTemp:"";
    const ctt=carriedTrackTemp(s,idx);
    const resolvedTT=ownTT!==""?ownTT:(ctt!=null?ctt:"");
    const sh=run.shock||{};
    TIRES.forEach(([k,lab])=>{
      const cold=s.cold[k], hot=run.p[k];
      let setv;
      if(run.set&&typeof run.set[k]==="number"){ setv=run.set[k]; }
      else if(idx>0 && typeof s.runs[idx-1].p[k]==="number"){ setv=s.runs[idx-1].p[k]; }
      else { setv=(typeof cold==="number")?cold:""; }
      const climb=(typeof cold==="number"&&typeof hot==="number")?Math.round((hot-cold)*10)/10:"";
      const climbSet=(typeof setv==="number"&&typeof hot==="number")?Math.round((hot-setv)*10)/10:"";
      const t=run.temps[k]||{o:"",m:"",i:""};
      const flag=tempFlag(t);
      const fl=flag==="over"?"OVER":flag==="under"?"UNDER":flag==="ok"?"OK":"";
      const amb=(run.ambient!=null&&run.ambient!=="")?run.ambient:"";
      const lat=run.gps?run.gps.lat:"", lon=run.gps?run.gps.lon:"";
      const place=run.gps&&run.gps.place?run.gps.place:"";
      const cond=run.gps&&run.gps.cond?run.gps.cond:"";
      rows.push([s.date,run.time||"",s.type,s.track,amb,resolvedTT,run.label,lab,
        hot,setv,cold,climbSet,climb,t.o,t.m,t.i,fl,run.notes||"",lat,lon,place,ctFor(k),lp,cond,
        car,tire,sh.f!=null?sh.f:"",sh.r!=null?sh.r:"",run.heat||""]);
    });
  });
  return rows;
}
const HEAD=["Date","Time","Type","Track","Ambient_F","TrackTemp_F","Session","Tire",
  "PSI","SetPSI","ColdPSI","ClimbVsSet","Climb","Temp_Outer","Temp_Mid","Temp_Inner","Flag","Notes","Lat","Lon","Location","ColdTemp_F","Laps","Condition",
  "Car","TireModel","ShockF","ShockR","HeatState"];
function toCSV(rows){
  const all=[HEAD,...rows];
  return all.map(r=>r.map(c=>{
    c=(c==null?"":String(c));
    return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;
  }).join(",")).join("\n");
}
function download(name,text){
  const blob=new Blob([text],{type:"text/csv"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function exportOne(id){const s=getS(id);
  const nm=(s.track||"session").replace(/\s+/g,"_");
  const ty=s.type==="autocross"?"autox":"track";
  const tod=((s.runs[0]&&s.runs[0].time)?s.runs[0].time:nowTime()).replace(/[^0-9]/g,"");
  download(nm+"_"+ty+"_"+s.date+"_"+tod+".csv",toCSV(rowsFor(s)));}
function exportAll(){
  let rows=[];DB.sessions.forEach(s=>{rows=rows.concat(rowsFor(s));});
  download("tire_log_all_"+todayStr()+".csv",toCSV(rows));
}

/* ---------- BACKUP / RESTORE (JSON) ---------- */
function backupAll(){
  const blob={version:2,exported:new Date().toISOString(),db:DB};
  const text=JSON.stringify(blob,null,2);
  const b=new Blob([text],{type:"application/json"});
  const url=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=url;
  a.download="tire_log_backup_"+todayStr()+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  DB.lastBackup=Date.now(); save(); render();
}
function triggerRestore(){document.getElementById("restoreFile").click();}
function mergeById(target,incoming){
  let added=0,updated=0;
  incoming.forEach(n=>{
    if(!n||!n.id)return;
    const i=target.findIndex(x=>x.id===n.id);
    if(i>=0){target[i]=n;updated++;}else{target.unshift(n);added++;}
  });
  return [added,updated];
}
function handleRestore(ev){
  const f=ev.target.files&&ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      const inc=data&&data.db;
      if(!inc||!Array.isArray(inc.sessions)) throw new Error("not a tire_log backup file");
      // profiles/refs first so restored sessions find their profile
      if(Array.isArray(inc.profiles)) mergeById(DB.profiles,inc.profiles);
      if(Array.isArray(inc.refs)) mergeById(DB.refs,inc.refs);
      const [added,updated]=mergeById(DB.sessions,inc.sessions);
      migrate(); // old v1 backups: tags sessions as RT660+
      save();
      alert("Restore complete\n+"+added+" new · "+updated+" updated");
      render();
    }catch(e){alert("Restore failed: "+e.message);}
    ev.target.value="";
  };
  r.readAsText(f);
}
function needsBackupNudge(){
  const hasRuns=DB.sessions.some(s=>s.runs&&s.runs.length>0);
  if(!hasRuns) return false;
  if(!DB.lastBackup) return true;
  return (Date.now()-DB.lastBackup) > 24*60*60*1000;
}
function backupAgeText(){
  if(!DB.lastBackup) return "never backed up";
  const mins=Math.floor((Date.now()-DB.lastBackup)/60000);
  if(mins<1) return "backed up just now";
  if(mins<60) return "backed up "+mins+"m ago";
  const hrs=Math.floor(mins/60);
  if(hrs<24) return "backed up "+hrs+"h ago";
  const days=Math.floor(hrs/24);
  return "backed up "+days+"d ago";
}
